_schema-version: 3.3.0
ID: incidents-managment
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: incidents-managment-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: incidents-managment-auth
      - name: incidents-managment-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      build-parameters:
        builder: npm-ci
  - name: incidents-managment-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: incidents-managment-db
    parameters:
      buildpack: nodejs_buildpack
  - name: incidents-managment-ui-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: incidents-managment-auth
      - name: srv-api
      - name: incidents-managment-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - incidents.zip
          name: incidents-managment-ui
          target-path: app/
  - name: incidents-managment-ui
    type: html5
    path: app/incidents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []
  - name: incidents-managment-destinations
    type: com.sap.application.content
    requires:
      - name: incidents-managment-auth
        parameters:
          service-key:
            name: incidents-managment-auth-key
      - name: incidents-managment-html5-repo-host
        parameters:
          service-key:
            name: incidents-managment-html5-repo-host-key
      - name: incidents-managment-destination-service
        parameters: 
          content-target: true
      - name: srv-api
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: incidents-srv-api
              Authentication: OAuth2UserTokenExchange
              URL: ~{srv-api/srv-url}
              ServiceInstanceName: incidents-managment-auth
              ServiceKeyName: incidents-managment-auth-key
              sap.cloud.service: incidentsmanagment
            - Name: html5-apps-repo-rt
              ServiceInstanceName: incidents-managment-html5-repo-host
              ServiceKeyName: incidents-managment-html5-repo-host-key
              sap.cloud.service: incidentsmanagment
    build-parameters:
      no-source: true
resources:
  - name: incidents-managment-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: incidents-managment-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        xsappname: incidents-managment-${org}-${space}
        tenant-mode: dedicated
        role-collections: 
        - description: generated
          name: support
          role-template-references:
          - $XSAPPNAME.support 
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: incidents-managment-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incidents-managment-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host