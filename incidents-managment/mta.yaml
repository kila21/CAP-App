_schema-version: 3.3.0
ID: incidents-managment
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: incidents-managment-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: incidents-managment-auth
      - name: incidents-managment-db
      - name: incidents-managment-destination-service
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters: 
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: incidents-managment-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: incidents-managment-db
    parameters:
      buildpack: nodejs_buildpack
  - name: incidents-managment-ui-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: incidents-managment-auth
      - name: srv-api
      - name: incidents-managment-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - incidents.zip
          name: incidents-managment-ui
          target-path: app/
  - name: incidents-managment-ui
    type: html5
    path: app/incidents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []
  - name: incidents-managment-destination
    type: com.sap.application.content
    requires:
      - name: incidents-managment-auth
        parameters:
          service-key:
            name: incidents-managment-auth-key
      - name: incidents-managment-repo-host
        parameters:
          service-key:
            name: incidents-managment-repo-host-key
      - name: srv-api
      - name: incidents-managment-destination-service
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: incidents-managment-repo
              ServiceInstanceName: incidents-managment-repo-host
              ServiceKeyName: incidents-managment-repo-host-key
              sap.cloud.service: incidentsmanagment.service
            - Authentication: OAuth2UserTokenExchange
              Name: incidents-managment-auth
              ServiceInstanceName: incidents-managment-auth
              ServiceKeyName: incidents-managment-auth-key
              sap.cloud.service: incidentsmanagment.service
    build-parameters:
      no-source: true

resources:
  - name: incidents-managment-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
    - name: srv-api
  - name: incidents-managment-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: incidents-managment-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
          - binding-secret
          - x509
  - name: incidents-managment-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incidents-managment-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
